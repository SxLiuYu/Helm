<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damselfish 用量看板</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#0d1b2d; --line:#203754; --text:#edf6ff; --muted:#8da5c0; --cyan:#3ddbd9; --green:#59e391; --red:#ff6b7d; --amber:#ffca63; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--text); background:radial-gradient(circle at 10% 0,#123252 0,transparent 38%),var(--bg); min-height:100vh; }
    .shell { max-width:1180px; margin:auto; padding:36px 20px 64px; }
    header { display:flex; justify-content:space-between; gap:20px; align-items:end; margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(28px,5vw,48px); letter-spacing:-.04em; }
    h1 span { color:var(--cyan); }
    .subtitle,.muted { color:var(--muted); }
    .status { padding:8px 12px; border:1px solid var(--line); border-radius:999px; white-space:nowrap; }
    .panel { background:rgba(13,27,45,.9); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 22px 70px rgba(0,0,0,.25); margin-bottom:20px; }
    .panel h2 { margin:0 0 14px; font-size:18px; }
    input,select { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; color:var(--text); background:#091525; outline:none; }
    input:focus,select:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(61,219,217,.12); }
    .auth { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .auth input { flex:1; min-width:220px; width:auto; }
    button { border:0; border-radius:10px; padding:10px 14px; color:#041018; background:var(--cyan); font-weight:700; cursor:pointer; font-family:inherit; }
    button.secondary { color:var(--text); background:#19304b; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    code { color:#b9f4f3; overflow-wrap:anywhere; }
    .nav-link { color:var(--cyan); font-weight:700; text-decoration:none; padding:8px 12px; border:1px solid var(--line); border-radius:999px; }
    .nav-link:hover { border-color:var(--cyan); }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .win-btn { padding:7px 12px; font-size:13px; }
    .win-btn.active { background:var(--cyan); color:#041018; }
    .auto-label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; margin-left:auto; cursor:pointer; }
    .auto-label input { width:auto; accent-color:var(--cyan); }
    .kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .kpi { background:#091525; border:1px solid var(--line); border-radius:13px; padding:14px; }
    .kpi-title { color:var(--muted); font-size:12px; letter-spacing:.05em; }
    .kpi-value { font-size:26px; font-weight:800; letter-spacing:-.02em; margin-top:4px; overflow-wrap:anywhere; }
    .kpi-sub { color:var(--muted); font-size:12px; margin-top:4px; }
    .ok-text { color:var(--green); } .bad-text { color:var(--red); }
    .chart-wrap { position:relative; }
    .chart-wrap svg { width:100%; height:auto; display:block; }
    .tooltip { position:absolute; pointer-events:none; background:#0a1626; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.6; box-shadow:0 10px 30px rgba(0,0,0,.4); opacity:0; transition:opacity .12s; white-space:nowrap; z-index:5; }
    .legend { display:flex; flex-wrap:wrap; gap:14px; color:var(--muted); font-size:12px; margin-bottom:8px; }
    .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
    .table-scroll { overflow-x:auto; }
    table.data { width:100%; border-collapse:collapse; font-size:13px; }
    table.data th, table.data td { text-align:left; padding:8px 9px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; }
    table.data th { color:var(--muted); font-weight:600; position:sticky; top:0; background:#0d1b2d; }
    th.sortable { cursor:pointer; user-select:none; }
    th.sortable:hover { color:var(--cyan); }
    th .arrow { font-size:10px; }
    .light { display:inline-block; width:9px; height:9px; border-radius:50%; }
    .iq { padding:2px 7px; border-radius:999px; font-size:11px; font-weight:700; display:inline-block; }
    .chip { padding:5px 10px; border-radius:999px; background:#17304b; color:#bcd3e9; font-size:12px; border:1px solid var(--line); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .share-track { height:5px; min-width:80px; background:#12233a; border-radius:99px; margin-top:6px; overflow:hidden; }
    .share-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#3ddbd9,#2b8fa8); }
    tr.err-row td { background:rgba(255,107,125,.07); }
    .stream-tag { color:var(--amber); }
    .empty-box { padding:28px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px; }
    @media (max-width:820px) { header { align-items:start; flex-direction:column; } }
  </style>
</head>
<body>
<main class="shell">
  <header>
    <div><div class="subtitle">BEIJING CLOUD · MODEL POOL</div><h1>Damselfish <span>用量看板</span></h1><div class="subtitle">Token 消耗、请求耗时与路由决策的可视化统计</div></div>
    <div id="navArea" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a href="../nodes" class="nav-link" id="navNodes">节点管理</a><span class="status" id="serverStatus">未登录</span></div>
  </header>
  <div class="panel auth" id="loginPanel">
    <input id="serviceKey" type="password" autocomplete="current-password" placeholder="输入北京 Damselfish 访问 Key">
    <button id="connectButton">登录</button>
  </div>
  <div id="dashboardBody" hidden>
    <div class="panel" id="kpis"></div>
    <div class="panel" id="windows"></div>
    <div class="panel" id="chart"></div>
    <div class="panel" id="targets"></div>
    <div class="panel" id="recent"></div>
  </div>
</main>
<script>
'use strict';
// ===== 常量与全局状态 =====
const WINDOWS = [[3600,'近1小时'],[86400,'近24小时'],[604800,'近7天'],[0,'全部']];
const AUTO_INTERVAL_MS = 15000;
const MOCK = new URLSearchParams(location.search).has('mock');
let currentWindow = 86400;      // 当前时间范围（秒，0=全部）
let autoOn = true;              // 自动刷新开关
let autoTimer = null;
let sortKey = 'requests';       // 目标表格排序键
let sortDir = 'desc';
let lastData = null;
const $ = (sel) => document.querySelector(sel);

function headers() { return {'Content-Type':'application/json'}; }
function escapeHtml(v){ return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function escapeAttr(v){ return escapeHtml(v).replace(/`/g,'&#96;'); }

async function api(path, options={}) {
  const response = await fetch(path, {credentials:'same-origin', ...options, headers:{...headers(), ...(options.headers||{})}});
  let body;
  try { body = await response.json(); } catch { body = {detail: await response.text()}; }
  if (!response.ok) throw Object.assign(new Error(body.detail || (body.error && body.error.message) || `HTTP ${response.status}`), {status: response.status});
  return body;
}

function showStatus(text, ok=null) {
  const el = $('#serverStatus');
  el.textContent = text;
  el.style.color = ok === false ? 'var(--red)' : ok === true ? 'var(--green)' : 'var(--text)';
}

// ===== 登录 / 退出 =====
async function login() {
  try {
    await api('./login', {method:'POST', body: JSON.stringify({key: $('#serviceKey').value})});
    $('#serviceKey').value = '';
    enterDashboard();
  } catch (e) { showStatus(e.message, false); }
}
$('#connectButton').onclick = login;
$('#serviceKey').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') login(); });

function enterDashboard() {
  $('#loginPanel').hidden = true;
  $('#dashboardBody').hidden = false;
  showStatus(MOCK ? '演示模式 · 内置样例数据' : '已登录', true);
  let logoutBtn = $('#logoutButton');
  if (!logoutBtn) {
    logoutBtn = document.createElement('button');
    logoutBtn.id = 'logoutButton'; logoutBtn.className = 'secondary'; logoutBtn.textContent = '退出登录';
    logoutBtn.style.padding = '7px 12px';
    $('#navArea').insertBefore(logoutBtn, $('#serverStatus'));
    logoutBtn.onclick = async () => {
      try { await api('./logout', {method:'POST'}); } catch {}
      exitDashboard();
    };
  }
  renderWindows();
  refreshDashboard(true);
  setupAutoRefresh();
}

function exitDashboard() {
  stopAutoRefresh();
  $('#dashboardBody').hidden = true;
  $('#loginPanel').hidden = false;
  showStatus('未登录');
}

// 导航链接：按当前目录解析为同级 nodes 页（本地 /admin/ 与反代子路径部署均正确）
(function fixNav() {
  const nav = $('#navNodes');
  if (nav) nav.href = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1) + 'nodes';
})();
// ===== 数值格式化 =====
function fmtInt(v) { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString('zh-CN') : '-'; }
function fmtTokens(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '-';
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(n);
}
function fmtMs(v) {
  if (v === null || v === undefined || v === '') return '-';
  const n = Number(v);
  if (!Number.isFinite(n)) return '-';
  if (n >= 60000) { const m = Math.floor(n / 60000), s = Math.round((n % 60000) / 1000); return `${m}m ${s}s`; }
  if (n >= 1000) return (n / 1000).toFixed(2) + 's';
  return Math.round(n) + 'ms';
}
function fmtCost(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (!Number.isFinite(n)) return null;
  if (n === 0) return '$0.00';
  if (n < 0.01) return '$' + n.toFixed(4);
  return '$' + n.toFixed(2);
}
const two = (v) => String(v).padStart(2, '0');
function fmtClock(ts) { const d = new Date(ts * 1000); return Number.isFinite(d.getTime()) ? `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}` : '-'; }
function relTime(ts) {
  const n = Number(ts);
  if (!Number.isFinite(n) || n <= 0) return '从未使用';
  const diff = Date.now() / 1000 - n;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
  if (diff < 86400 * 30) return `${Math.floor(diff / 86400)} 天前`;
  const d = new Date(n * 1000);
  return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}`;
}

// ===== 数据获取 =====
async function refreshDashboard(manual=false) {
  showStatus(MOCK ? '演示模式 · 内置样例数据' : (manual ? '正在刷新…' : $('#serverStatus').textContent));
  let data;
  if (MOCK) {
    data = buildMockData();
    renderDashboard(data);
    return;
  }
  try {
    data = await api(`./api/usage/dashboard?window=${currentWindow}`);
    renderDashboard(data);
  } catch (e) {
    if (e.status === 401 || e.status === 403) { exitDashboard(); showStatus('登录已过期，请重新输入 Key', false); return; }
    showStatus('加载失败：' + e.message, false);
    if (!lastData && manual) $('#dashboardBody').hidden = false;
  }
}

// ===== 时间范围按钮组 =====
function renderWindows() {
  const box = $('#windows');
  box.innerHTML = '<h2>统计范围</h2><div class="toolbar" id="windowButtons"></div>';
  const bar = box.querySelector('#windowButtons');
  WINDOWS.forEach(([sec, label]) => {
    const btn = document.createElement('button');
    btn.className = 'secondary win-btn' + (sec === currentWindow ? ' active' : '');
    btn.textContent = label;
    btn.dataset.sec = String(sec);
    btn.onclick = () => {
      currentWindow = sec;
      box.querySelectorAll('.win-btn').forEach((b) => b.classList.toggle('active', b === btn));
      refreshDashboard(true);
    };
    bar.appendChild(btn);
  });
  // 手动刷新 + 自动刷新开关
  const autoLabel = document.createElement('label');
  autoLabel.className = 'auto-label';
  autoLabel.innerHTML = `<input type="checkbox" id="autoToggle" ${autoOn ? 'checked' : ''}> 自动刷新`;
  bar.appendChild(autoLabel);
  const refreshBtn = document.createElement('button');
  refreshBtn.className = 'secondary'; refreshBtn.textContent = '手动刷新';
  refreshBtn.onclick = () => refreshDashboard(true);
  bar.appendChild(refreshBtn);
  box.querySelector('#autoToggle').onchange = (ev) => { autoOn = ev.target.checked; setupAutoRefresh(); };
}
// ===== 总渲染入口 =====
function safe(fn, label) { try { fn(); } catch (e) { console.error(label, e); } }
function renderDashboard(data) {
  lastData = data || {};
  const d = lastData;
  const gen = Number(d.generated_at);
  showStatus(MOCK ? '演示模式 · 内置样例数据' : `已登录 · 更新于 ${Number.isFinite(gen) ? fmtClock(gen) : ''}`, true);
  $('#dashboardBody').hidden = false;
  safe(() => renderKpis(d.summary || {}), 'KPI');
  safe(() => renderChart(d.series || []), '图表');
  safe(() => renderScenarioChips(d.summary && d.summary.by_scenario), '场景');
  safe(() => renderTargets(d.targets || []), '目标表');
  safe(() => renderRecent(d.recent || []), '流水');
}

// ===== KPI 卡片 =====
function kpiCard(title, value, sub, cls='') {
  return `<div class="kpi ${cls}"><div class="kpi-title">${escapeHtml(title)}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`;
}
function renderKpis(s) {
  const req = Number(s.requests) || 0;
  const ok = Number(s.successes) || 0;
  const fail = Number(s.failures) || 0;
  let rate = s.success_rate;
  rate = (rate === null || rate === undefined || rate === '') ? (req ? ((ok / req) * 100).toFixed(1) + '%' : '-') : String(rate) + '%';
  const cost = fmtCost(s.est_cost_usd);
  const cards = [
    kpiCard('总请求', fmtInt(req), `<span class="ok-text">成功 ${fmtInt(ok)}</span> · <span class="bad-text">失败 ${fmtInt(fail)}</span> · 成功率 ${escapeHtml(rate)}`),
    kpiCard('总 Tokens', fmtTokens(s.total_tokens), `输入 ${fmtTokens(s.prompt_tokens)} / 输出 ${fmtTokens(s.completion_tokens)}`),
    kpiCard('平均耗时', fmtMs(s.avg_latency_ms), '成功请求的平均响应时间'),
    kpiCard('P95 耗时', fmtMs(s.p95_latency_ms), '95% 的请求快于此值'),
    kpiCard('错误次数', fmtInt(fail), fail > 0 ? '<span class="bad-text">存在失败请求，请检查流水</span>' : '窗口内无失败'),
    kpiCard('估算成本', cost === null ? '-' : escapeHtml(cost), cost === null ? '未配置单价，可在 routing.usage_cost_per_1m_tokens 配置' : '按 usage_cost_per_1m_tokens 单价估算'),
  ];
  $('#kpis').innerHTML = '<h2>核心指标</h2><div class="kpi-grid">' + cards.join('') + '</div>';
}
// ===== 时间序列图（原生 SVG）=====
function axisBucketLabel(ts, mode) {
  const d = new Date(ts * 1000);
  if (!Number.isFinite(d.getTime())) return '-';
  return mode === 'time' ? `${two(d.getHours())}:${two(d.getMinutes())}` : `${d.getFullYear() % 100}${two(d.getMonth() + 1)}-${two(d.getDate())}`;
}
let resizeBound = false;
function renderChart(series) {
  const box = $('#chart');
  if (!Array.isArray(series) || !series.length) { box.innerHTML = '<h2>时间序列</h2><div class="empty-box">当前范围内暂无请求数据，换个范围或稍后再试。</div>'; return; }
  const W = Math.max(560, Math.min(1100, (box.clientWidth || 900) - 42)), H = 270;
  const L = 46, R = 56, T = 16, B = 28, pw = W - L - R, ph = H - T - B;
  const n = series.length, bw = pw / n;
  const num = (v) => Number(v);
  const maxReq = Math.max(1, ...series.map((b) => num(b.requests) || 0));
  const lats = series.map((b) => num(b.avg_latency_ms)).filter((v) => Number.isFinite(v));
  const maxLat = Math.max(1, ...lats);
  const mode = currentWindow > 0 && currentWindow <= 86400 ? 'time' : 'date';
  const y1 = (v) => T + ph - (num(v) / maxReq) * ph;
  const y2 = (v) => T + ph - (num(v) / maxLat) * ph;
  const s = [];
  for (let g = 0; g <= 4; g++) {
    const gy = T + (ph * g) / 4, rv = Math.round((maxReq * (4 - g)) / 4), lv = maxLat * (4 - g) / 4;
    s.push(`<line x1="${L}" y1="${gy}" x2="${W - R}" y2="${gy}" stroke="#203754" stroke-width="1" ${g < 4 ? 'stroke-dasharray="3 5"' : ''} opacity=".55"/>`);
    s.push(`<text x="${L - 7}" y="${gy + 4}" text-anchor="end" font-size="10" fill="#8da5c0">${rv}</text>`);
    s.push(`<text x="${W - R + 8}" y="${gy + 4}" font-size="10" fill="#8da5c0">${lv >= 1000 ? (lv / 1000).toFixed(1) + 's' : Math.round(lv) + 'ms'}</text>`);
  }
  const step = Math.max(1, Math.ceil(n / 7));
  series.forEach((b, i) => {
    const cx = L + bw * (i + 0.5), req = Math.max(0, num(b.requests) || 0), err = Math.max(0, Math.min(num(b.errors) || 0, req));
    const okH = ((req - err) / maxReq) * ph, errH = (err / maxReq) * ph;
    if (req > 0) {
      s.push(`<rect x="${(cx - bw * 0.32).toFixed(1)}" y="${(T + ph - okH).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${okH.toFixed(1)}" rx="${Math.min(3, bw * 0.3)}" fill="#3ddbd9" opacity=".82"/>`);
      if (err > 0) s.push(`<rect x="${(cx - bw * 0.32).toFixed(1)}" y="${(T + ph - okH - errH).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(errH, 1.5).toFixed(1)}" rx="2" fill="#ff6b7d"/>`);
    }
    if (i % step === 0) s.push(`<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#8da5c0">${escapeHtml(axisBucketLabel(num(b.bucket_start), mode))}</text>`);
  });
  let seg = null;
  series.forEach((b, i) => {
    const v = num(b.avg_latency_ms);
    if (!Number.isFinite(v)) { seg = null; return; }
    const p = `${(L + bw * (i + 0.5)).toFixed(1)},${y2(v).toFixed(1)}`;
    if (seg) seg.pts.push(p); else seg = { pts: [p] };
  });
  if (seg) {
    s.push(`<polyline points="${seg.pts.join(' ')}" fill="none" stroke="#ffca63" stroke-width="2" stroke-linejoin="round"/>`);
    series.forEach((b, i) => { const v = num(b.avg_latency_ms); if (Number.isFinite(v)) s.push(`<circle cx="${(L + bw * (i + 0.5)).toFixed(1)}" cy="${y2(v).toFixed(1)}" r="3" fill="#ffca63"/>`); });
  }
  series.forEach((b, i) => s.push(`<rect class="hit" data-i="${i}" x="${(L + i * bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ph}" fill="transparent" style="cursor:crosshair"/>`));
  box.innerHTML = `<h2>时间序列</h2><div class="legend"><span><i style="background:#3ddbd9"></i>请求数（左轴）</span><span><i style="background:#ff6b7d"></i>其中错误</span><span><i style="background:#ffca63"></i>平均耗时 · 折线（右轴）</span></div><div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="请求与耗时时间序列图">${s.join('')}</svg><div class="tooltip"></div></div>`;
  const wrap = box.querySelector('.chart-wrap'), tip = box.querySelector('.tooltip');
  box.querySelectorAll('.hit').forEach((hit) => {
    hit.addEventListener('mouseenter', () => {
      const b = series[Number(hit.dataset.i)] || {};
      hit.setAttribute('fill', 'rgba(61,219,217,.07)');
      tip.innerHTML = `<strong>${escapeHtml(axisBucketLabel(num(b.bucket_start), mode))}</strong><br>请求 ${fmtInt(b.requests)} · 错误 ${fmtInt(b.errors)}<br>Tokens：${fmtTokens(num(b.prompt_tokens || 0) + num(b.completion_tokens || 0))}<br>平均耗时 ${fmtMs(b.avg_latency_ms)}`;
      tip.style.opacity = '1';
    });
    hit.addEventListener('mousemove', (ev) => {
      const r = wrap.getBoundingClientRect();
      let lx = ev.clientX - r.left + 14, ly = ev.clientY - r.top + 12;
      if (lx + 180 > r.width) lx = ev.clientX - r.left - 190;
      tip.style.left = `${lx}px`; tip.style.top = `${ly}px`;
    });
    hit.addEventListener('mouseleave', () => { hit.setAttribute('fill', 'transparent'); tip.style.opacity = '0'; });
  });
  if (!resizeBound) {
    resizeBound = true;
    let rt = null;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (lastData) safe(() => renderChart((lastData.series || [])), '图表'); }, 220); });
  }
}
// ===== 场景分布 + 目标表格 =====
let targetsData = [];
function iqBadge(v) {
  const n = Number(v);
  if (!Number.isFinite(n) || n <= 0) return '-';
  const cls = n >= 85 ? ['var(--cyan)', '#123c3b'] : n >= 70 ? ['var(--green)', '#123c31'] : n >= 50 ? ['var(--amber)', '#44351b'] : ['#8da5c0', '#1a2940'];
  return `<span class="iq" style="color:${cls[0]};background:${cls[1]}">${n}</span>`;
}
function statusLight(t) {
  const req = Number(t.requests) || 0;
  if (!req) return '<span class="light" style="background:#44587a" title="无流量"></span>';
  const failRate = (Number(t.failures) || 0) / req;
  if (failRate >= 0.2) return '<span class="light" style="background:var(--red)" title="失败率较高"></span>';
  return '<span class="light" style="background:var(--green)" title="运行正常"></span>';
}
function sortTargets() {
  targetsData.sort((a, b) => {
    const va = Number(a[sortKey]) || 0, vb = Number(b[sortKey]) || 0;
    return sortDir === 'desc' ? vb - va : va - vb;
  });
}
function arrow(key) { return key === sortKey ? `<span class="arrow">${sortDir === 'desc' ? '▼' : '▲'}</span>` : ''; }
function renderScenarioChips(byScenario) {
  let el = document.getElementById('scenarioPanel');
  if (!el) { el = document.createElement('div'); el.className = 'panel'; el.id = 'scenarioPanel'; const anchor = document.getElementById('chart'); if (anchor && anchor.after) anchor.after(el); }
  const entries = Object.entries(byScenario && typeof byScenario === 'object' ? byScenario : {});
  el.innerHTML = `<h2>场景分布</h2>` + (entries.length
    ? `<div class="chips">${entries.sort((a, b) => (Number(b[1]) || 0) - (Number(a[1]) || 0)).map(([k, v]) => `<span class="chip">${escapeHtml(k === '' || k === 'null' ? '未指定' : k)} · ${fmtInt(v)}</span>`).join('')}</div>`
    : '<div class="muted">窗口内暂无场景数据</div>');
}
function renderTargets(list) {
  targetsData = Array.isArray(list) ? list.filter((t) => t && typeof t === 'object') : [];
  sortTargets();
  const grandTotal = targetsData.reduce((acc, t) => acc + (Number(t.total_tokens) || 0), 0);
  const rows = targetsData.length ? targetsData.map((t) => {
    const req = Number(t.requests) || 0, okN = Number(t.successes) || 0, failN = Number(t.failures) || 0;
    const pt = Number(t.prompt_tokens) || 0, ct = Number(t.completion_tokens) || 0, tt = Number(t.total_tokens) || 0;
    const share = grandTotal > 0 ? Math.min(100, (tt / grandTotal) * 100) : 0;
    return `<tr>
      <td>${statusLight(t)}</td>
      <td><strong>${escapeHtml(t.label || t.target_id || '-')}</strong><div class="muted" style="font-size:11px"><code>${escapeHtml(t.target_id || '-')}</code></div></td>
      <td><code>${escapeHtml(t.model || '-')}</code></td>
      <td>${iqBadge(t.intelligence)}</td>
      <td>${t.provider == null || t.provider === '' ? '<span class="muted">-</span>' : `<span class="chip">${escapeHtml(t.provider)}</span>`}</td>
      <td><strong>${fmtInt(req)}</strong></td>
      <td><span class="ok-text">${fmtInt(okN)}</span> / ${failN > 0 ? `<span class="bad-text">${fmtInt(failN)}</span>` : fmtInt(failN)}</td>
      <td>${(Number(t.rate_limits) || 0) > 0 ? `<span class="stream-tag">${fmtInt(t.rate_limits)}</span>` : fmtInt(t.rate_limits)}</td>
      <td><strong>${fmtTokens(tt)}</strong> · 输入 ${fmtTokens(pt)} / 输出 ${fmtTokens(ct)}<div class="share-track"><div class="share-fill" style="width:${share.toFixed(1)}%"></div></div></td>
      <td>${fmtMs(t.avg_latency_ms)}</td>
      <td>${fmtMs(t.p95_latency_ms)}</td>
      <td class="muted">${escapeHtml(relTime(t.last_used_at))}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="12"><div class="empty-box">当前范围内没有任何目标被调用</div></td></tr>';
  $('#targets').innerHTML = `<h2>目标节点用量</h2><div class="table-scroll"><table class="data">
    <thead><tr><th></th><th>目标</th><th>模型</th><th title="智能分">智分</th><th>Provider</th>
    <th class="sortable" data-key="requests">请求数 ${arrow('requests')}</th><th>成功/失败</th><th>限流</th>
    <th class="sortable" data-key="total_tokens">Tokens ${arrow('total_tokens')}</th><th>平均耗时</th><th>P95</th><th>最近使用</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $('#targets').querySelectorAll('th.sortable').forEach((th) => {
    th.onclick = () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir = sortDir === 'desc' ? 'asc' : 'desc'; else { sortKey = key; sortDir = 'desc'; }
      renderTargets(targetsData);
    };
  });
}
// ===== 最近请求流水 =====
function renderRecent(list) {
  let rows = Array.isArray(list) ? list.filter((r) => r && typeof r === 'object') : [];
  rows.sort((a, b) => (Number(b.created_at) || 0) - (Number(a.created_at) || 0));
  rows = rows.slice(0, 50);
  const body = rows.length ? rows.map((r) => {
    const okReq = Number(r.success) === 1;
    const errText = r.error ? escapeHtml(String(r.error).slice(0, 80)) : '';
    const isStream = Number(r.stream) === 1;
    return `<tr${okReq ? '' : ' class="err-row"'}>
      <td class="muted">${escapeHtml(fmtClock(Number(r.created_at)))}</td>
      <td><code>${escapeHtml(r.target_id || '-')}</code></td>
      <td>${r.scenario ? `<span class="chip">${escapeHtml(r.scenario)}</span>` : '<span class="muted">-</span>'}</td>
      <td>${r.project_id == null || r.project_id === '' ? '<span class="muted">-</span>' : `<span class="chip">${escapeHtml(r.project_id)}</span>`}</td>
      <td>${isStream ? '<span class="stream-tag">⚡ 流式</span>' : '<span class="muted">-</span>'}</td>
      <td>${okReq ? '<span class="ok-text">✓ 成功</span>' : `<span class="bad-text">✗ 失败</span>${r.status != null ? ` · HTTP ${fmtInt(r.status)}` : ''}${errText ? `<div class="muted" style="max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${escapeAttr(r.error)}">${errText}</div>` : ''}`}</td>
      <td>${fmtMs(r.latency_ms)}</td>
      <td>${isStream && r.first_token_ms != null ? fmtMs(r.first_token_ms) : '<span class="muted">-</span>'}</td>
      <td>${fmtTokens(r.prompt_tokens)} / ${fmtTokens(r.completion_tokens)} / ${fmtTokens(r.total_tokens)}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="9"><div class="empty-box">窗口内暂无请求流水</div></td></tr>';
  $('#recent').innerHTML = `<h2>最近请求</h2><div class="table-scroll"><table class="data">
    <thead><tr><th>时间</th><th>目标</th><th>场景</th><th>项目</th><th>模式</th><th>状态</th><th>耗时</th><th>首字延迟</th><th>Tokens（输入/输出/总）</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

// ===== 自动刷新 =====
function stopAutoRefresh() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
function setupAutoRefresh() {
  stopAutoRefresh();
  if (!autoOn || MOCK) return;
  autoTimer = setInterval(() => { if (!document.hidden) refreshDashboard(false); }, AUTO_INTERVAL_MS);
}
let visBound = false;
if (!visBound) {
  visBound = true;
  document.addEventListener('visibilitychange', () => { if (!document.hidden && autoOn && !MOCK && $('#dashboardBody') && !$('#dashboardBody').hidden) refreshDashboard(true); });
}
